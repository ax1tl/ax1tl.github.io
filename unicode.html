<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Unicode Library</title>
  <link rel="stylesheet" href="unicodeStyle.css">
</head>
<body>

  <header>
    <div class="header-left">
      <h1>The Unicode <span>Library</span></h1>
      <p class="subtitle">65,536 characters · click any glyph to copy</p>
    </div>
    <span class="header-badge">U+0000 → U+FFFF</span>
  </header>

  <main>
    <section class="control-panel">

      <div class="search-block">
        <label for="searchbar" class="field-label">Jump to codepoint</label>
        <div class="input-row">
          <span class="input-prefix">U+</span>
          <input class="inSearch" type="text" id="searchbar" placeholder="0041" oninput="generateSearch()">
        </div>
        <div id="searchOut" class="search-result-area"></div>
      </div>

      <div class="page-block">
        <div class="field-row">
          <div class="field-group">
            <label class="field-label">Page</label>
            <div class="input-row">
              <button class="nav-btn" onclick="prevPage()">&#8592;</button>
              <input class="inBox" type="text" id="pageNum" value="1" oninput="generateButtons()">
              <button class="nav-btn" onclick="nextPage()">&#8594;</button>
            </div>
          </div>
          <div class="field-group">
            <label class="field-label">Per page</label>
            <div class="input-row">
              <button class="nav-btn" onclick="prevAmnt()">&#8592;</button>
              <input class="inBox" type="text" id="pageAmnt" value="256" oninput="generateButtons()">
              <button class="nav-btn" onclick="nextAmnt()">&#8594;</button>
            </div>
          </div>
        </div>
        <p class="page-hint" id="pageHint"></p>
      </div>

    </section>

    <div class="grid-container" id="mainGrid"></div>

    <div class="copied-toast" id="toast">Copied to clipboard</div>
  </main>

  <footer>
    <p>The Unicode Library &mdash; ax1</p>
  </footer>

  <script>
    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

    function copyToClipboard(character) {
      const el = document.createElement('textarea');
      el.value = character;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 1400);
    }

    function makeButton(character, codeStr) {
      const button = document.createElement('div');
      button.classList.add('grid-item');
      button.innerHTML = `<span class="glyph">${character}</span><span class="code">${codeStr}</span>`;
      button.onclick = function () {
        copyToClipboard(character);
        showToast();
        this.classList.add('copied');
        delay(900).then(() => this.classList.remove('copied'));
      };
      return button;
    }

    function prevPage() {
      const p = document.getElementById('pageNum');
      p.value = Math.max(1, parseInt(p.value) - 1);
      generateButtons();
    }

    function nextPage() {
      const p = document.getElementById('pageNum');
      const a = parseInt(document.getElementById('pageAmnt').value);
      const max = Math.floor(65536 / a) + 1;
      p.value = Math.min(max, parseInt(p.value) + 1);
      generateButtons();
    }

    function prevAmnt() {
      const a = document.getElementById('pageAmnt');
      a.value = Math.max(16, parseInt(a.value) / 4);
      generateButtons();
    }

    function nextAmnt() {
      const a = document.getElementById('pageAmnt');
      a.value = Math.min(4096, parseInt(a.value) * 4);
      generateButtons();
    }

    function generateButtons() {
      const pageNum = parseInt(document.getElementById('pageNum').value);
      const pageAmnt = parseInt(document.getElementById('pageAmnt').value);
      const container = document.getElementById('mainGrid');
      container.innerHTML = '';

      const start = pageAmnt * (pageNum - 1);
      const end = Math.min(pageAmnt * pageNum, 65536);

      for (let i = start; i < end; i++) {
        const character = String.fromCharCode(i);
        const code = 'U+' + i.toString(16).toUpperCase().padStart(4, '0');
        container.appendChild(makeButton(character, code));
      }

      const maxPage = Math.floor(65536 / pageAmnt) + 1;
      document.getElementById('pageHint').textContent =
        `Page ${pageNum} of ${maxPage} · chars ${start}–${end}`;
    }

    function generateSearch() {
      const val = document.getElementById('searchbar').value.trim();
      const out = document.getElementById('searchOut');
      out.innerHTML = '';
      if (!val) return;
      const code = parseInt(val, 16);
      if (isNaN(code) || code < 0 || code > 65535) return;
      const character = String.fromCharCode(code);
      const codeStr = 'U+' + code.toString(16).toUpperCase().padStart(4, '0');
      out.appendChild(makeButton(character, codeStr));
    }

    generateButtons();
  </script>

</body>
</html>

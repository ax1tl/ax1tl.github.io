    <script>
        const canvas = document.getElementById('noise_texture');
        const ctx = canvas.getContext('2d');
        const scale = 2;

        function resizeCanvas() {
          canvas.width = window.innerWidth/scale;
          canvas.height = window.innerHeight/scale;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function generateNoise() {
          const imgData = ctx.createImageData(canvas.width, canvas.height);
          const data = imgData.data;
        
          for (let i = 0; i < data.length; i += 4) {
            data[i]     = Math.floor(Math.random() * 255);  // red
            data[i + 1] = Math.floor(Math.random() * 255);  // green
            data[i + 2] = Math.floor(Math.random() * 255);  // blue
            data[i + 3] = 100;                              // alpha
          }

          ctx.putImageData(imgData, 0, 0);
          setTimeout(() => {
            requestAnimationFrame(generateNoise);
          }, 10);
        }

        generateNoise();


        function copyToClipboard(text) {
			const el = document.createElement('textarea');
			el.value = text;
			document.body.appendChild(el);
			el.select();
			document.execCommand('copy');
			document.body.removeChild(el);
		}

        (() => {
            const root = document.documentElement;
            const BG = 'images/bg5.jpg';

            // peak positions as FRACTIONS of the bg image (0-1)
            const PEAKS = [
                { x: 0.265, y: 0.409 }, // far left
                { x: 0.329, y: 0.456 }, // small far left

                { x: 0.431, y: 0.406 }, // center
                { x: 0.553, y: 0.481 }, // small peak center
                
                { x: 0.703, y: 0.393 }, // small peak right
                { x: 0.726, y: 0.385 }, // right
                { x: 0.813, y: 0.444 }, // far right
            ];

            const CAMPS = [
                { x: 0.264, y: 0.817, peaks: [0, 1, 2] }, // left hump
                { x: 0.431, y: 0.966, peaks: [0, 1, 2, 3] }, // valley
                { x: 0.694, y: 0.642, peaks: [4, 5, 6] }, // house
            ];

            const rand = (a, b) => a + Math.random() * (b - a);

            // 0 = sharp zig-zag, 1 = fully smooth curves
            // tip: test live with  yoursite.com/?smooth=0.6
            const q = parseFloat(new URLSearchParams(location.search).get('smooth'));
            const SMOOTHNESS = Number.isFinite(q) ? Math.min(1, Math.max(0, q)) : 0.35;

            let revealed = false;
            function reveal() {
                if (revealed) return;
                revealed = true;
                root.classList.remove('preload');
                root.classList.add('loaded');
            }

            // map an image-fraction to screen px, matching background-size: cover
            function toScreen(p, iw, ih) {
                const vw = innerWidth, vh = innerHeight;
                const s = Math.max(vw / iw, vh / ih);
                return {
                    x: (vw - iw * s) / 2 + p.x * iw * s,
                    y: (vh - ih * s) / 2 + p.y * ih * s,
                };
            }
        
            // jagged path: many waypoints, hard corners, jitter tapers off near the peak
            function buildPath(a, b) {
                const n = 16;
                const spread = 0.09;
                const dx = b.x - a.x, dy = b.y - a.y;
                const len = Math.hypot(dx, dy);
                const nx = -dy / len, ny = dx / len;

                const pts = [a];
                for (let i = 1; i <= n; i++) {
                    const t = i / (n + 1) + rand(-0.025, 0.025);
                    const taper = 1 - Math.pow(t, 2);
                    const j = rand(-1, 1) * len * spread * taper;
                    pts.push({ x: a.x + dx * t + nx * j, y: a.y + dy * t + ny * j });
                }
                pts.push(b);
            
                const r = SMOOTHNESS * 0.5;
                const lerp = (p, q, k) => ({ x: p.x + (q.x - p.x) * k, y: p.y + (q.y - p.y) * k });
            
                let d = `M ${a.x} ${a.y}`;
                for (let i = 1; i < pts.length - 1; i++) {
                    const p = pts[i];
                    const s = lerp(p, pts[i - 1], r);
                    const e = lerp(p, pts[i + 1], r);
                    d += ` L ${s.x} ${s.y} Q ${p.x} ${p.y} ${e.x} ${e.y}`;
                }
                return d + ` L ${b.x} ${b.y}`;
            }

            // ---------- timer ----------
            const $ = id => document.getElementById(id);
            const svg = $('loader_svg'), trail = $('trail'), head = $('trail_head'),
                  ring = $('peak_ring'), campsG = $('camps'),
                  readout = $('time_readout'), setMin = $('set_min'), setSec = $('set_sec'),
                  bStart = $('btn_start'), bPause = $('btn_pause'), bStop = $('btn_stop');

            let iw = 0, ih = 0;
            let duration = 240000;          // ms, default 4:00
            let elapsed = 0;                // ms
            let state = 'idle';             // idle | running | paused | done
            let last = 0, raf = 0, total = 0, camp = null, peak = null;

            const fmt = ms => {
                const s = Math.ceil(ms / 1000);
                return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
            };

            function readTime() {
                const m = Math.max(0, parseInt(setMin.value, 10) || 0);
                const s = Math.min(59, Math.max(0, parseInt(setSec.value, 10) || 0));
                duration = Math.max(1000, (m * 60 + s) * 1000);
            }

            // pick a random camp + peak and lay the trail out, fully hidden
            function setupRoute() {
                svg.setAttribute('viewBox', `0 0 ${innerWidth} ${innerHeight}`);

                const campDef = CAMPS[Math.floor(Math.random() * CAMPS.length)];
                const peakDef = PEAKS[campDef.peaks[Math.floor(Math.random() * campDef.peaks.length)]];
                camp = toScreen(campDef, iw, ih);
                peak = toScreen(peakDef, iw, ih);
                trail.setAttribute('d', buildPath(camp, peak));

                campsG.innerHTML = '';
                CAMPS.forEach(c => {
                    const p = toScreen(c, iw, ih);
                    const el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    el.setAttribute('x', p.x - 4);
                    el.setAttribute('y', p.y - 4);
                    el.setAttribute('width', 8);
                    el.setAttribute('height', 8);
                    el.setAttribute('class', 'camp' + (p.x === camp.x && p.y === camp.y ? ' active' : ''));
                    campsG.appendChild(el);
                });

                total = trail.getTotalLength();
                trail.style.strokeDasharray = total;
            }

            function draw() {
                const p = Math.min(elapsed / duration, 1);   // linear so the dot matches the clock
                trail.style.strokeDashoffset = total * (1 - p);
                const pt = trail.getPointAtLength(total * p);
                head.setAttribute('cx', pt.x);
                head.setAttribute('cy', pt.y);
                const t = fmt(duration - elapsed);
                readout.textContent = t;
                document.title = 'ax1tl.home';
            }

            function updateUI() {
                bStart.textContent = state === 'paused' ? 'resume' : 'start';
                bStart.disabled = state === 'running';
                bPause.disabled = state !== 'running';
                bStop.disabled = state === 'idle';
                setMin.disabled = setSec.disabled = state === 'running' || state === 'paused';
            }

            function tick(now) {
                elapsed += now - last;
                last = now;
                if (elapsed >= duration) return finish();
                draw();
                raf = requestAnimationFrame(tick);
            }

            function start() {
                if (state === 'running') return;
                if (state === 'done') stop();
                if (state === 'idle') { readTime(); elapsed = 0; }
                state = 'running';
                last = performance.now();
                raf = requestAnimationFrame(tick);
                updateUI();
            }

            function pause() {
                if (state !== 'running') return;
                cancelAnimationFrame(raf);
                state = 'paused';
                draw();
                updateUI();
            }

            function stop() {
                cancelAnimationFrame(raf);
                state = 'idle';
                elapsed = 0;
                ring.classList.remove('ping');
                readTime();
                setupRoute();      // new random hike each reset
                draw();
                updateUI();
            }

            function finish() {
                cancelAnimationFrame(raf);
                state = 'done';
                elapsed = duration;
                draw();
                ring.setAttribute('cx', peak.x);
                ring.setAttribute('cy', peak.y);
                ring.classList.add('ping');
                                updateUI();
            }

            bStart.addEventListener('click', start);
            bPause.addEventListener('click', pause);
            bStop.addEventListener('click', stop);

            // changing the time while idle/done updates the readout
            [setMin, setSec].forEach(el => el.addEventListener('input', () => {
                if (state === 'done') stop();
                if (state !== 'idle') return;
                readTime();
                draw();
            }));

            const img = new Image();
            img.onload = () => {
                iw = img.naturalWidth; ih = img.naturalHeight;
                setupRoute();
                draw();
                updateUI();
                reveal();
            };
            img.onerror = reveal;
            img.src = BG;
        })();



        addEventListener('click', e => {
    const img = new Image(); img.src = 'images/bg5.jpg';
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const s = Math.max(innerWidth / iw, innerHeight / ih);
    const x = (e.clientX - (innerWidth - iw * s) / 2) / (iw * s);
    const y = (e.clientY - (innerHeight - ih * s) / 2) / (ih * s);
    console.log({ x: +x.toFixed(3), y: +y.toFixed(3) });
});
    </script>
